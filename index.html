<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>وارثی بک</title>
<meta name="theme-color" content="#0b2b33">
<meta name="description" content="ہارڈویئر دکان کا کھاتہ، اسٹاک، بل اور رپورٹس">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="وارثی بک">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ur">
  <header class="top"><div class="top-in">
    <div class="brand-wrap">
      <div class="logo-ring"><img class="logo" src="logo.png" alt="Warsi Hardware" width="58" height="54"></div>
      <div class="brand-text">
        <h1 class="brand">وارثی بک</h1>
        <div class="brand-tag"><span class="t1">WARSI HARDWARE<i aria-hidden="true">◆</i></span><span class="motto">CARE YOUR DREAMS</span></div>
      </div>
    </div>
    <div class="who" id="whoChip" hidden><span class="who-txt"><b id="who"></b><small id="whoRole"></small></span><span class="who-av" id="whoAv"></span></div>
    <div class="hdr-tools">
      <div class="branch-pick"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6"/></svg><label for="branchSel" class="sr">برانچ</label><select id="branchSel"></select></div>
      <div class="date-pill"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="todayStr"></span></div>
    </div>
  </div></header>
  <div class="shell">
    <nav class="tabs" id="tabs" aria-label="حصے"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="sheet" hidden></div>
<div id="auth" dir="rtl" lang="ur" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
